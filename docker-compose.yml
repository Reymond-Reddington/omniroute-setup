version: '3.8'

services:
  omniroute:
    image: diegosouzapw/omniroute:latest
    container_name: omniroute
    restart: unless-stopped
    ports:
      - "20128:20128"
    volumes:
      - omniroute-data:/app/data
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=20128
      - HOSTNAME=0.0.0.0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:20128/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  omniroute-data:
    name: omniroute-data
